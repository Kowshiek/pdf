<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My PDF Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #101827;
            color: white;
            text-align: center;
            padding: 20px;
            margin: 0;
        }

        h1 {
            color: #38bdf8;
            margin-bottom: 8px;
        }

        p {
            color: #94a3b8;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .view-controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: #1e293b;
            color: #e2e8f0;
            border: 1px solid #334155;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .tab-btn:hover {
            background: #334155;
            color: #ffffff;
        }

        .tab-btn.active {
            background: #0284c7;
            border-color: #38bdf8;
            color: #ffffff;
        }

        iframe {
            width: 95%;
            height: 70vh;
            background: white;
            border: none;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .downloads-section {
            margin-top: 25px;
        }

        .downloads-title {
            font-size: 1.1rem;
            color: #cbd5e1;
            margin-bottom: 14px;
            font-weight: 600;
        }

        .download-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #16a34a;
            color: white;
            padding: 13px 22px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.95rem;
            transition: background 0.2s ease, transform 0.1s ease;
            box-shadow: 0 2px 8px rgba(22, 163, 74, 0.3);
        }

        .download-btn:hover {
            background: #15803d;
            transform: translateY(-1px);
        }
    </style>
</head>

<body>

    <h1>📚 My PDF Viewer</h1>
    <p>Select a document to preview or download any of the PDFs below.</p>

    <!-- Switch Preview Controls -->
    <div class="view-controls">
        <button class="tab-btn active" onclick="switchPdf('SS UNIT 1 2 3.pdf', this)">Unit 1, 2 &amp; 3</button>
        <button class="tab-btn" onclick="switchPdf('ss unit 7.pdf', this)">Unit 7</button>
        <button class="tab-btn" onclick="switchPdf('SS UNIT-9.pdf', this)">Unit 9</button>
        <button class="tab-btn" onclick="switchPdf('SS_ Chapter 10,11.pdf', this)">Chapter 10 &amp; 11</button>
    </div>

    <!-- PDF Viewer Frame -->
    <iframe id="pdf-frame" src="SS UNIT 1 2 3.pdf"></iframe>

    <!-- 4 Separate Download Buttons -->
    <div class="downloads-section">
        <div class="downloads-title">📥 Download PDFs</div>
        <div class="download-group">
            <a class="download-btn" href="SS UNIT 1 2 3.pdf" download="SS UNIT 1 2 3.pdf">
                ⬇ Download Unit 1, 2 &amp; 3
            </a>
            <a class="download-btn" href="ss unit 7.pdf" download="ss unit 7.pdf">
                ⬇ Download Unit 7
            </a>
            <a class="download-btn" href="SS UNIT-9.pdf" download="SS UNIT-9.pdf">
                ⬇ Download Unit 9
            </a>
            <a class="download-btn" href="SS_ Chapter 10,11.pdf" download="SS_ Chapter 10,11.pdf">
                ⬇ Download Chapter 10 &amp; 11
            </a>
        </div>
    </div>

    <script>
        function switchPdf(fileName, btn) {
            document.getElementById('pdf-frame').src = fileName;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }
    </script>

</body>
</html>
